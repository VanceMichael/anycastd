---
announcer:
  router_id: 10.3.3.3
  local_address: 10.0.0.1
  local_asn: 65999
  routes:
    - 10.0.0.128/32
  peers:
    - name: some_router_1
      remote_address: 10.0.0.252
      remote_asn: 65000
services:
  - name: edge
    check_interval: 10s
    checks:
      - name: uplink-a
        kind: icmp_ping
        group: uplinks
        spec:
          static:
            host: 192.0.2.1
          tries: 3
          interval: 100ms
          timeout: 5s
      - name: uplink-b
        kind: icmp_ping
        group: uplinks
        spec:
          static:
            host: 192.0.2.2
          tries: 5
          interval: 200ms
          timeout: 5s
metrics:
  enabled: true
  address: 127.0.0.1:9090
